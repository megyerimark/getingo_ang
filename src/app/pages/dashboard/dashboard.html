<div class="container py-5">

  @if (isLoading) {

    <div class="text-center">

      <div class="spinner-border"></div>

    </div>

  } @else if (user) {

    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>

        <h1>
          Szia, {{ user.name }}!
        </h1>

        <p class="text-secondary mb-0">
          {{ user.email }}
        </p>

      </div>

      <button
        class="btn btn-outline-danger"
        (click)="logout()"
      >
        Kijelentkezés
      </button>

    </div>


    <div class="row g-3">

      <div class="col-md-4">

        <div class="card shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              XP
            </h5>

            <div class="display-6">
              {{ user.xp_points }}
            </div>

          </div>

        </div>

      </div>


      <div class="col-md-4">

        <div class="card shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              Streak
            </h5>

            <div class="display-6">
              {{ user.current_streak }}
            </div>

          </div>

        </div>

      </div>


      <div class="col-md-4">

        <div class="card shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              Szerepkör
            </h5>

            <div class="display-6">
              {{ user.role }}
            </div>

          </div>

        </div>

      </div>

    </div>

  }

</div>
